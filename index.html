<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',            theme: {
                extend: {}
            }
        }
    </script>
    <style>
        body {
            font-family: arial, sans-serif;
        }
        /* Custom hover shadow for the search bar (Light Mode) */
        @media (prefers-color-scheme: light) {
            .search-shadow:hover, .search-shadow:focus-within {
                box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
                border-color: rgba(223, 225, 229, 0) !important;
            }
        }
        /* Custom hover shadow/effect for the search bar (Dark Mode) */
        @media (prefers-color-scheme: dark) {
            .search-shadow:hover, .search-shadow:focus-within {
                box-shadow: 0 1px 6px rgba(23, 23, 23, 0.9);
                background-color: #303134 !important; /* Slight lightening on hover like real Google */
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-[#202124] dark:bg-[#202124] dark:text-[#e8eaed] transition-colors duration-200">

    <header class="flex justify-between items-center p-3 text-[13px] md:p-4">
        <!-- Top-left corner: Custom WWZ link (Fixed Clickability) -->
        <div class="flex items-center">
            <a href="https://www.wwz.im/" target="_blank" style="z-index: 50; position: relative;" class="p-2 hover:bg-gray-100 dark:hover:bg-[#303134] rounded-full transition-colors ml-1 cursor-pointer">
                <img src="https://wangwenzhi.eu.org/images/favicon_io/apple-touch-icon.png" alt="WWZ.IM" class="h-8 w-8 rounded-full">
            </a>
        </div>
        
        <!-- Top-right corner: Standard Google links without avatar -->
        <div class="flex items-center space-x-2 sm:space-x-4 pr-1 sm:pr-2 font-medium">
            <a href="https://mail.google.com" target="_blank" class="hover:underline px-1 hidden sm:inline-block">Gmail</a>
            <a href="https://images.google.com" target="_blank" class="hover:underline px-1 hidden sm:inline-block">Images</a>
            
            <!-- 9-dot App Grid SVG (Adapts to dark mode via currentColor) -->
            <a href="https://about.google/products/" target="_blank" class="p-2 hover:bg-gray-100 dark:hover:bg-[#303134] rounded-full transition-colors flex items-center justify-center w-10 h-10 ml-1 text-[#5f6368] dark:text-[#e8eaed]" aria-label="Google apps">
                <svg focusable="false" viewBox="0 0 24 24" width="24" height="24">
                    <path d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z" fill="currentColor"></path>
                </svg>
            </a>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center w-full mt-12 sm:mt-[10vh] px-4 sm:px-5">
        
        <!-- Google Logo: Swaps to light version in dark mode using picture element -->
        <div class="mb-6 sm:mb-8 flex justify-center">
            <picture>
                <source srcset="https://www.google.com/images/branding/googlelogo/2x/googlelogo_light_color_272x92dp.png" media="(prefers-color-scheme: dark)">
                <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google" class="w-[160px] sm:w-[272px] h-auto object-contain">
            </picture>
        </div>
        
        <!-- Functional Search Form Redirecting to Google -->
        <form action="https://www.google.com/search" method="GET" class="w-full max-w-[584px]">
            <div class="search-shadow flex items-center w-full border border-[#dfe1e5] dark:border-[#5f6368] rounded-full px-3 sm:px-4 py-[8px] sm:py-[10px] transition-all bg-white dark:bg-[#202124]">
                <!-- Search Icon -->
                <div class="pr-3 text-[#9aa0a6] flex items-center justify-center pl-1 sm:pl-0">
                    <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"></path>
                    </svg>
                </div>
                
                <!-- Search Input -->
                <input type="text" name="q" class="flex-grow bg-transparent outline-none text-[16px] text-[#202124] dark:text-[#e8eaed] h-[28px] sm:h-[24px]" required aria-label="Search" autocomplete="off" autofocus>
                
                <!-- Mic Icon (Camera icon removed) -->
                <div class="flex items-center pl-2 sm:pl-3 pr-1 sm:pr-2">
                    <a href="#" class="cursor-pointer flex items-center justify-center w-6 h-6" aria-label="Search by voice">
                        <svg class="w-[20px] h-[20px] sm:w-[24px] sm:h-[24px] hover:opacity-80" focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" fill="#4285f4"></path>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" fill="#34a853"></path>
                            <path d="M9 5v6c0 1.66 1.34 3 3 3V5H9z" fill="#fbbc05"></path>
                            <path d="M15 5v6c0 1.66-1.34 3-3 3V5h3z" fill="#ea4335"></path>
                        </svg>
                    </a>
                </div>
            </div>
            
            <!-- Search Buttons (Hidden on small screens, flex on sm and up) -->
            <div class="hidden sm:flex justify-center mt-7 space-x-3">
                <button type="submit" class="bg-[#f8f9fa] dark:bg-[#303134] text-[#3c4043] dark:text-[#e8eaed] border border-[#f8f9fa] dark:border-[#303134] hover:border-[#dadce0] dark:hover:border-[#5f6368] hover:shadow-sm px-4 py-[9px] rounded text-[14px] cursor-pointer focus:outline-none transition-all">
                    Google Search
                </button>
                <button type="button" onclick="window.location.href='https://www.google.com/doodles'" class="bg-[#f8f9fa] dark:bg-[#303134] text-[#3c4043] dark:text-[#e8eaed] border border-[#f8f9fa] dark:border-[#303134] hover:border-[#dadce0] dark:hover:border-[#5f6368] hover:shadow-sm px-4 py-[9px] rounded text-[14px] cursor-pointer focus:outline-none transition-all">
                    I'm Feeling Lucky
                </button>
            </div>
        </form>
    </main>

    <footer class="bg-[#f2f2f2] dark:bg-[#171717] text-[#70757a] dark:text-[#9aa0a6] text-[14px] sm:text-[15px] w-full transition-colors duration-200">
        <!-- Top Section: Location -->
        <div class="px-4 sm:px-8 py-[10px] sm:py-[15px] border-b border-[#dadce0] dark:border-[#3c4043]">
            United States
        </div>
        
        <!-- Bottom Section: Links (Stack and wrap correctly on mobile) -->
        <div class="flex flex-col sm:flex-row sm:justify-between px-4 sm:px-8 py-[10px] sm:py-[14px]">
            
            <!-- Left Links: Wrapped centrally on mobile, left on desktop -->
            <div class="flex flex-wrap justify-center sm:justify-start gap-x-5 sm:gap-x-7 gap-y-3 mb-4 sm:mb-0">
                <a href="https://about.google/" class="hover:underline">About</a>
                <a href="https://ads.google.com/" class="hover:underline">Advertising</a>
                <a href="https://smallbusiness.google.com/" class="hover:underline">Business</a>
                <a href="https://www.google.com/search/howsearchworks/" class="hover:underline">How Search works</a>
            </div>
            
            <!-- Right Links: Wrapped centrally on mobile, right on desktop -->
            <div class="flex flex-wrap justify-center sm:justify-end gap-x-5 sm:gap-x-7 gap-y-3">
                <a href="https://policies.google.com/privacy" class="hover:underline">Privacy</a>
                <a href="https://policies.google.com/terms" class="hover:underline">Terms</a>
                <a href="#" class="hover:underline">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
