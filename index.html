<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A clean, minimal Google Search homepage.">
  <title>Google</title>
  <link rel="icon" href="https://www.google.com/favicon.ico">
  <style>
    :root{color-scheme:light dark;--page:#fff;--text:#202124;--muted:#5f6368;--line:#dfe1e5;--hover:#f8f9fa;--footer:#f2f2f2;--footer-line:#dadce0;--focus:#1a73e8}
    @media(prefers-color-scheme:dark){:root{--page:#202124;--text:#e8eaed;--muted:#bdc1c6;--line:#5f6368;--hover:#303134;--footer:#171717;--footer-line:#3c4043;--focus:#8ab4f8}}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;display:flex;flex-direction:column;background:var(--page);color:var(--text);font:14px Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    a:hover{text-decoration:underline}
    button,input{font:inherit}
    .topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
    .brand-link{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;transition:background .18s}
    .brand-link:hover,.icon-link:hover{background:var(--hover);text-decoration:none}
    .brand-link img{width:30px;height:30px;border-radius:50%}
    .top-links{display:flex;align-items:center;gap:18px;font-size:13px}
    .top-links>a:not(.apps){padding:7px 0}
    .icon-link{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted)}
    .apps svg{width:22px;height:22px;fill:currentColor}
    main{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;padding:clamp(42px,10vh,100px) 22px 48px}
    .logo{display:block;width:272px;max-width:65vw;height:auto;margin:0 auto 26px}
    .search-form{width:min(100%,584px)}
    .searchbox{height:46px;width:100%;display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:0 14px;gap:12px;transition:box-shadow .18s,border-color .18s,background .18s}
    .searchbox:hover,.searchbox:focus-within{background:var(--page);border-color:transparent;box-shadow:0 1px 6px rgba(32,33,36,.28)}
    @media(prefers-color-scheme:dark){.searchbox:hover,.searchbox:focus-within{background:var(--hover);box-shadow:0 1px 6px rgba(0,0,0,.45)}}
    .search-icon{width:20px;height:20px;flex:none;color:#9aa0a6}
    #query{min-width:0;flex:1;height:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}
    .clear-btn,.voice-btn{width:30px;height:34px;display:none;align-items:center;justify-content:center;flex:none;border:0;background:transparent;color:var(--muted);border-radius:50%;cursor:pointer}
    .clear-btn.visible{display:inline-flex}
    .voice-btn{display:inline-flex}
    .clear-btn:hover,.voice-btn:hover{background:var(--hover)}
    .voice-btn svg{width:22px;height:22px}
    .buttons{display:flex;justify-content:center;gap:12px;margin-top:28px}
    .search-btn{min-height:36px;padding:0 16px;border:1px solid var(--hover);border-radius:4px;background:var(--hover);color:var(--text);cursor:pointer;transition:border-color .15s,box-shadow .15s}
    .search-btn:hover,.search-btn:focus-visible{border-color:var(--line);box-shadow:0 1px 1px rgba(0,0,0,.1);outline:0}
    .hint{min-height:22px;margin-top:16px;color:var(--muted);font-size:12px;text-align:center}
    .recent{width:min(100%,584px);margin-top:8px;color:var(--muted)}
    .recent[hidden]{display:none}
    .recent-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 7px;font-size:12px}
    .recent-clear{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;padding:5px 7px;border-radius:6px}
    .recent-clear:hover{background:var(--hover);color:var(--text)}
    .recent-list{list-style:none;margin:0;padding:0}
    .recent-item{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 10px;border-radius:8px}
    .recent-item:hover{background:var(--hover)}
    .recent-query{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);text-align:left;padding:8px 2px;border:0;background:transparent;cursor:pointer}
    .recent-remove{flex:none;border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:50%;font-size:18px;cursor:pointer;opacity:.65}
    .recent-remove:hover{opacity:1;background:var(--page)}
    .recent-clock{width:16px;height:16px;flex:none;color:var(--muted)}
    footer{background:var(--footer);color:var(--muted);font-size:14px}
    .region{padding:15px 30px;border-bottom:1px solid var(--footer-line)}
    .footer-links{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:14px 30px}
    .link-group{display:flex;flex-wrap:wrap;gap:20px}
    @media(max-width:600px){.recent{margin-top:4px}.topbar{height:56px;padding:0 12px}.top-links{gap:14px}main{padding:54px 20px 38px}.logo{width:190px;margin-bottom:25px}.searchbox{height:46px;padding:0 12px;gap:9px}.buttons{margin-top:24px;gap:8px}.search-btn{padding:0 12px;font-size:13px}.hint{margin-top:20px}.region{padding:14px 20px}.footer-links{flex-direction:column;gap:18px;padding:18px 16px}.link-group{justify-content:center;gap:16px 22px}.link-group a{white-space:nowrap}}
    @media(max-height:560px){main{padding-top:24px}.logo{width:180px;margin-bottom:20px}.buttons{margin-top:18px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand-link" href="https://www.wwz.im/" target="_blank" rel="noopener noreferrer" aria-label="WWZ homepage">
      <img src="https://wangwenzhi.eu.org/images/favicon_io/apple-touch-icon.png" alt="WWZ">
    </a>
    <nav class="top-links" aria-label="Google links">
      <a href="https://mail.google.com/">Gmail</a>
      <a href="https://images.google.com/">Images</a>
      <a class="icon-link apps" href="https://about.google/products/" target="_blank" rel="noopener noreferrer" aria-label="Google apps" title="Google apps">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg>
      </a>
    </nav>
  </header>

  <main>
    <picture>
      <source srcset="https://www.google.com/images/branding/googlelogo/2x/googlelogo_light_color_272x92dp.png" media="(prefers-color-scheme: dark)">
      <img class="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google" width="272" height="92" fetchpriority="high">
    </picture>
    <form class="search-form" id="searchForm" action="https://www.google.com/search" method="get" role="search">
      <div class="searchbox">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14A4.5 4.5 0 1 1 9.5 5a4.5 4.5 0 0 1 0 9z"/></svg>
        <input id="query" type="search" name="q" aria-label="Search Google" autocomplete="off" spellcheck="false" required autofocus>
        <button class="clear-btn" id="clearBtn" type="button" aria-label="Clear search" title="Clear">×</button>
        <button class="voice-btn" id="voiceBtn" type="button" aria-label="Search by voice" title="Search by voice">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285f4" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path fill="#34a853" d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11z"/><path fill="#ea4335" d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3z"/><path fill="#fbbc05" d="M9 5v6a3 3 0 0 0 3 3V2a3 3 0 0 0-3 3z"/></svg>
        </button>
      </div>
      <div class="buttons">
        <button class="search-btn" type="submit">Google Search</button>
        <button class="search-btn" id="luckyBtn" type="button">I'm Feeling Lucky</button>
      </div>
      <div class="hint" id="hint" aria-live="polite"></div>
    </form>
    <section class="recent" id="recentSection" aria-label="Recent searches" hidden>
      <div class="recent-head"><span>Recent searches</span><button class="recent-clear" id="clearRecent" type="button">Clear history</button></div>
      <ul class="recent-list" id="recentList"></ul>
    </section>
  </main>

  <footer>
    <div class="region">United States</div>
    <div class="footer-links">
      <nav class="link-group" aria-label="About Google">
        <a href="https://about.google/">About</a>
        <a href="https://ads.google.com/">Advertising</a>
        <a href="https://smallbusiness.google.com/">Business</a>
        <a href="https://www.google.com/search/howsearchworks/">How Search works</a>
      </nav>
      <nav class="link-group" aria-label="Privacy and settings">
        <a href="https://policies.google.com/privacy">Privacy</a>
        <a href="https://policies.google.com/terms">Terms</a>
        <a href="https://www.google.com/preferences">Settings</a>
      </nav>
    </div>
  </footer>
  <script>
    (() => {
      const form = document.getElementById('searchForm');
      const input = document.getElementById('query');
      const clear = document.getElementById('clearBtn');
      const voice = document.getElementById('voiceBtn');
      const lucky = document.getElementById('luckyBtn');
      const hint = document.getElementById('hint');
      const recentSection = document.getElementById('recentSection');
      const recentList = document.getElementById('recentList');
      const clearRecent = document.getElementById('clearRecent');
      const HISTORY_KEY = 'google_recent_searches_v1';
      const HISTORY_LIMIT = 6;

      function readHistory() {
        try {
          const value = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          return Array.isArray(value) ? value.filter(item => typeof item === 'string').slice(0, HISTORY_LIMIT) : [];
        } catch (_) { return []; }
      }
      function saveSearch(value) {
        const query = value.trim().replace(/\\s+/g, ' ').slice(0, 300);
        if (!query) return;
        const history = [query, ...readHistory().filter(item => item.toLocaleLowerCase() !== query.toLocaleLowerCase())].slice(0, HISTORY_LIMIT);
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (_) {}
      }
      function renderHistory() {
        const history = readHistory();
        recentList.replaceChildren();
        recentSection.hidden = history.length === 0 || input.value.trim().length > 0;
        history.forEach(query => {
          const item = document.createElement('li');
          item.className = 'recent-item';
          const clock = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          clock.setAttribute('viewBox', '0 0 24 24');
          clock.setAttribute('class', 'recent-clock');
          clock.setAttribute('aria-hidden', 'true');
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('fill', 'currentColor');
          path.setAttribute('d', 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 11h5v-2h-4V6h-2v6a1 1 0 0 0 1 1z');
          clock.append(path);
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'recent-query';
          button.textContent = query;
          button.title = query;
          button.addEventListener('click', () => { input.value = query; updateClear(); form.requestSubmit(); });
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'recent-remove';
          remove.textContent = '×';
          remove.setAttribute('aria-label', 'Remove recent search: ' + query);
          remove.title = 'Remove';
          remove.addEventListener('click', () => {
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(readHistory().filter(item => item !== query))); } catch (_) {}
            renderHistory();
          });
          item.append(clock, button, remove);
          recentList.append(item);
        });
      }
      form.addEventListener('submit', () => saveSearch(input.value));
      clearRecent.addEventListener('click', () => {
        try { localStorage.removeItem(HISTORY_KEY); } catch (_) {}
        renderHistory();
      });

      const updateClear = () => clear.classList.toggle('visible', input.value.length > 0);
      input.addEventListener('input', () => { updateClear(); renderHistory(); });
      clear.addEventListener('click', () => {
        input.value = '';
        updateClear();
        input.focus();
      });
      lucky.addEventListener('click', () => {
        const q = input.value.trim();
        if (!q) { input.focus(); return; }
        saveSearch(q);\n        const params = new URLSearchParams({q, btnI: '1'});
        window.location.href = 'https://www.google.com/search?' + params.toString();
      });

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        voice.addEventListener('click', () => {
          hint.textContent = 'Voice search is not supported in this browser. Please type your search.';
        });
        voice.setAttribute('aria-label', 'Voice search unavailable');
      } else {
        const recognition = new SpeechRecognition();
        recognition.lang = navigator.language || 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        voice.addEventListener('click', () => {
          hint.textContent = 'Listening…';
          try { recognition.start(); } catch (_) { hint.textContent = 'Voice search is already active.'; }
        });
        recognition.addEventListener('result', event => {
          input.value = event.results[0][0].transcript;
          updateClear();
          hint.textContent = '';
          form.requestSubmit();
        });
        recognition.addEventListener('error', event => {
          hint.textContent = event.error === 'not-allowed'
            ? 'Microphone access is blocked. Allow microphone permission to use voice search.'
            : 'Voice search could not start. Please try again or type your search.';
        });
        recognition.addEventListener('end', () => {
          if (hint.textContent === 'Listening…') hint.textContent = '';
        });
      }
      document.addEventListener('keydown', event => {
        if (event.key === '/' && document.activeElement !== input && !event.ctrlKey && !event.metaKey && !event.altKey) {
          event.preventDefault();
          input.focus();
        }
        if (event.key === 'Escape' && document.activeElement === input && input.value) {
          input.value = '';
          updateClear();
        }
      });
      updateClear();
    })();
  </script>
</body>
</html>
